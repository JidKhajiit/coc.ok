services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardtrades
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardtrades}
      POSTGRES_DB: cardtrades
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardtrades -d cardtrades']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cardtrades:${POSTGRES_PASSWORD:-cardtrades}@db:5432/cardtrades
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  pgdata:
